<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Стоит ли покупать?</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 0;
        }
        header {
            text-align: center;
            padding: 2rem 0;
            border-bottom: 1px solid #333;
        }
        h1 {
            margin: 0;
            font-size: 2.5rem;
            color: #fff;
        }
        .tabs {
            display: flex;
            justify-content: center;
            margin: 1.5rem 0;
            gap: 10px;
        }
        .tab-btn {
            padding: 10px 20px;
            background-color: #333;
            color: #fff;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            transition: background 0.3s;
        }
        .tab-btn:hover {
            background-color: #555;
        }
        .tab-btn.active {
            background-color: #bb86fc;
            color: #000;
        }
        .tab-content {
            display: none;
            padding: 2rem;
            max-width: 600px;
            margin: 0 auto;
        }
        .tab-content.active {
            display: block;
        }
        .calculator-box {
            background: #1e1e1e;
            padding: 1.5rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .input-group {
            margin-bottom: 1rem;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
            color: #ccc;
        }
        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #444;
            background: #000;
            color: #fff;
            box-sizing: border-box;
        }
        .quick-buttons {
            display: flex;
            gap: 8px;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }
        .quick-btn {
            padding: 8px 12px;
            background: #333;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .quick-btn:hover {
            background: #555;
        }
        button.action-btn {
            background-color: #03dac6;
            color: #000;
            padding: 12px 24px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }
        .result {
            margin-top: 1.5rem;
            padding: 1rem;
            background: #2a2a2a;
            border-radius: 5px;
            border-left: 4px solid #bb86fc;
        }
        .rain-effect {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: -1;
        }
        .drop {
            position: absolute;
            bottom: 100%;
            width: 2px;
            background: rgba(187, 134, 252, 0.6);
            animation: fall linear forwards;
        }
        @keyframes fall {
            to {
                transform: translateY(110vh);
            }
        }
        /* Стили для других вкладок */
        .section-text {
            line-height: 1.6;
            color: #aaa;
        }
    </style>
</head>
<body>
    <div class="rain-effect" id="rain"></div>
    <header>
        <h1>Стоит ли покупать?</h1>
    </header>

    <div class="tabs">
        <button class="tab-btn active" onclick="openTab(event, 'purchases')">🛒 Покупки</button>
        <button class="tab-btn" onclick="openTab(event, 'car')">🔧 Машина</button>
        <button class="tab-btn" onclick="openTab(event, 'house')">🏠 Дом</button>
    </div>

    <!-- Вкладка Покупки -->
    <div id="purchases" class="tab-content active">
        <div class="calculator-box">
            <div class="input-group">
                <label for="item">Что покупаешь?</label>
                <input type="text" id="item" placeholder="например, кроссовки">
            </div>
            <div class="input-group">
                <label for="price">Цена (₽)</label>
                <input type="number" id="price" placeholder="Сколько стоит">
            </div>
            <div class="input-group">
                <label for="salary">Твой доход в месяц (₽)</label>
                <input type="number" id="salary" placeholder="Твой доход">
            </div>
            <div class="quick-buttons">
                <button class="quick-btn" onclick="setQuickItem('кроссовки', 12000)">Кроссовки</button>
                <button class="quick-btn" onclick="setQuickItem('смартфон', 35000)">Смартфон</button>
                <button class="quick-btn" onclick="setQuickItem('наушники', 8000)">Наушники</button>
                <button class="quick-btn" onclick="setRandomItem()">Случайная покупка</button>
            </div>
            <button class="action-btn" onclick="calculate()">Рассчитать</button>
            <div class="result" id="result"></div>
        </div>
    </div>

    <!-- Вкладка Машина -->
    <div id="car" class="tab-content">
        <div class="calculator-box">
            <p class="section-text">
                Здесь будет калькулятор для машины: кредит, страховка, бензин и ТО. Пока в разработке!
            </p>
        </div>
    </div>

    <!-- Вкладка Дом -->
    <div id="house" class="tab-content">
        <div class="calculator-box">
            <p class="section-text">
                Здесь будет калькулятор для дома: ипотека, коммунальные платежи и ремонт. Пока в разработке!
            </p>
        </div>
    </div>

    <script>
        function openTab(evt, tabName) {
            const contents = document.querySelectorAll('.tab-content');
            const buttons = document.querySelectorAll('.tab-btn');
            
            contents.forEach(content => content.classList.remove('active'));
            buttons.forEach(btn => btn.classList.remove('active'));
            
            document.getElementById(tabName).classList.add('active');
            evt.currentTarget.classList.add('active');
        }

        const items = [
            { name: 'кроссовки', price: 12000 },
            { name: 'смартфон', price: 35000 },
            { name: 'наушники', price: 8000 },
            { name: 'кофемашина', price: 25000 },
            { name: 'велосипед', price: 30000 },
            { name: 'игровая консоль', price: 45000 },
            { name: 'умные часы', price: 15000 },
            { name: 'фотоаппарат', price: 60000 },
            { name: 'электросамокат', price: 28000 },
            { name: 'ноутбук', price: 75000 }
        ];

        function setQuickItem(name, price) {
            document.getElementById('item').value = name;
            document.getElementById('price').value = price;
            document.getElementById('result').innerHTML = '';
        }

        function setRandomItem() {
            const random = items[Math.floor(Math.random() * items.length)];
            document.getElementById('item').value = random.name;
            document.getElementById('price').value = random.price;
            document.getElementById('result').innerHTML = '';
        }

        function calculate() {
            const item = document.getElementById('item').value.trim();
            const price = parseFloat(document.getElementById('price').value);
            const salary = parseFloat(document.getElementById('salary').value);
            const resultDiv = document.getElementById('result');

            if (!item || isNaN(price)) {
                resultDiv.innerHTML = '<strong style="color: #ff5252;">Пожалуйста, заполни название и цену!</strong>';
                return;
            }

            let message = '';
            if (salary) {
                const days = (price / (salary / 30));
                const daysText = days.toFixed(1).replace('.', ',');
                message = `Цена "${item}" — ${price.toLocaleString()} ₽. Это примерно ${daysText} дней твоей работы (при зарплате ${salary.toLocaleString()} ₽).`;
            } else {
                message = `Цена "${item}" — ${price.toLocaleString()} ₽.`;
            }

            resultDiv.innerHTML = message;
        }

        // Анимация дождя
        function createRain() {
            const rain = document.getElementById('rain');
            const dropCount = 50;
            for (let i = 0; i < dropCount; i++) {
                const drop = document.createElement('div');
                drop.classList.add('drop');
                drop.style.left = Math.random() * 100 + 'vw';
                drop.style.animationDuration = (Math.random() * 2 + 1) + 's';
                drop.style.animationDelay = Math.random() * 2 + 's';
                rain.appendChild(drop);
            }
        }
        createRain();
    </script>
</body>
</html>
