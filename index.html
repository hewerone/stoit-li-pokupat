<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Стоит ли это покупать? 💸</title>
<style>
:root{
  --bg:#07070f; --card:#12121f; --card2:#1a1a2e;
  --neon1:#00ffd5; --neon2:#7c4dff; --neon3:#ff2e63;
  --text:#e8e8f5; --muted:#8a8aa3;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:var(--bg); color:var(--text);
  font-family:'Segoe UI',system-ui,sans-serif;
  min-height:100vh; overflow-x:hidden; position:relative;
}
.blob{position:fixed;border-radius:50%;filter:blur(90px);opacity:.25;z-index:0;pointer-events:none}
.b1{width:420px;height:420px;background:var(--neon2);top:-120px;left:-120px;animation:float1 14s ease-in-out infinite}
.b2{width:360px;height:360px;background:var(--neon1);bottom:-100px;right:-80px;animation:float2 18s ease-in-out infinite}
.b3{width:260px;height:260px;background:var(--neon3);top:40%;left:55%;opacity:.12;animation:float1 22s ease-in-out infinite reverse}
@keyframes float1{0%,100%{transform:translate(0,0)}50%{transform:translate(60px,40px)}}
@keyframes float2{0%,100%{transform:translate(0,0)}50%{transform:translate(-50px,-40px)}}
.wrap{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:24px 16px 60px}
header{text-align:center;padding:26px 0 6px}
h1{
  font-size:clamp(26px,5vw,42px);font-weight:800;letter-spacing:-.5px;
  background:linear-gradient(90deg,var(--neon1),var(--neon2),var(--neon3),var(--neon1));
  background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:shine 6s linear infinite;
}
@keyframes shine{to{background-position:300% 0}}
.sub{color:var(--muted);margin-top:8px;font-size:15px}
.tabs{display:flex;gap:8px;justify-content:center;margin:24px 0 20px;flex-wrap:wrap}
.tab{
  padding:10px 20px;border-radius:30px;cursor:pointer;font-size:15px;font-weight:600;
  background:var(--card);color:var(--muted);border:1px solid #2a2a44;transition:.25s;
}
.tab:hover{border-color:var(--neon1);color:var(--text)}
.tab.active{background:linear-gradient(90deg,var(--neon2),var(--neon3));color:#fff;border-color:transparent;box-shadow:0 0 24px rgba(124,77,255,.45)}
.card{
  background:linear-gradient(160deg,var(--card),var(--card2));
  border:1px solid #2a2a44;border-radius:22px;padding:26px;
  box-shadow:0 20px 60px rgba(0,0,0,.5);
  animation:cardIn .5s ease;
}
@keyframes cardIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.card.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
label{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px;font-weight:600;letter-spacing:.3px;text-transform:uppercase}
input[type=number],select{
  width:100%;padding:13px 16px;border-radius:12px;border:1px solid #2a2a44;
  background:#0d0d18;color:var(--text);font-size:16px;outline:none;transition:.2s;
}
input:focus,select:focus{border-color:var(--neon1);box-shadow:0 0 0 3px rgba(0,255,213,.12)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{
  flex:1;min-width:80px;padding:11px 8px;border-radius:12px;cursor:pointer;
  background:#0d0d18;color:var(--muted);border:1px solid #2a2a44;font-size:14px;transition:.2s;
}
.seg button.on{background:rgba(0,255,213,.12);border-color:var(--neon1);color:var(--neon1)}
.btn-big{
  width:100%;margin-top:20px;padding:16px;border:none;border-radius:14px;cursor:pointer;
  font-size:17px;font-weight:800;letter-spacing:.3px;color:#0a0a12;
  background:linear-gradient(90deg,var(--neon1),#4dfff0,var(--neon2));
  background-size:200% 100%;transition:.3s;animation:shine 5s linear infinite;
}
.btn-big:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(0,255,213,.35)}
.btn-ghost{
  width:100%;margin-top:10px;padding:13px;border-radius:12px;cursor:pointer;
  background:transparent;color:var(--neon2);border:1px solid var(--neon2);
  font-size:15px;font-weight:700;transition:.25s;
}
.btn-ghost:hover{background:rgba(124,77,255,.12);transform:translateY(-1px)}
.result{margin-top:24px;display:none;animation:cardIn .5s ease}
.result.show{display:block}
.big-num{
  text-align:center;font-size:clamp(56px,14vw,96px);font-weight:900;line-height:1;
  color:var(--neon1);text-shadow:0 0 40px rgba(0,255,213,.6);
}
.big-num.danger{color:var(--neon3);text-shadow:0 0 40px rgba(255,46,99,.6)}
.big-label{text-align:center;color:var(--muted);font-size:14px;margin-top:6px;text-transform:uppercase;letter-spacing:2px}
.verdict{
  text-align:center;font-size:clamp(20px,4vw,28px);font-weight:800;margin:18px 0 6px;
  animation:pop .5s cubic-bezier(.2,1.6,.4,1);
}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
.timer{
  text-align:center;font-size:18px;font-weight:700;color:var(--neon2);
  font-variant-numeric:tabular-nums;margin:10px 0 4px;
}
.bars{margin-top:18px}
.bar-row{margin:12px 0}
.bar-top{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:5px}
.bar{height:12px;background:#0d0d18;border-radius:8px;overflow:hidden}
.bar-fill{height:100%;border-radius:8px;width:0;transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.f1{background:linear-gradient(90deg,var(--neon1),var(--neon2))}
.f2{background:linear-gradient(90deg,var(--neon2),var(--neon3))}
.f3{background:linear-gradient(90deg,#ff9f1c,var(--neon3))}
.alt-box{
  margin-top:18px;padding:16px;border-radius:14px;background:rgba(124,77,255,.08);
  border:1px dashed var(--neon2);
}
.alt-box h3{font-size:14px;color:var(--neon2);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px}
.alt-item{padding:6px 0;font-size:15px;border-bottom:1px solid rgba(124,77,255,.15)}
.alt-item:last-child{border:none}
.copy-btn{
  margin-top:16px;width:100%;padding:13px;border-radius:12px;cursor:pointer;font-size:15px;font-weight:700;
  background:rgba(0,255,213,.1);color:var(--neon1);border:1px solid var(--neon1);transition:.2s;
}
.copy-btn:hover{background:rgba(0,255,213,.2)}
.grave{
  margin-top:26px;padding:18px;border-radius:16px;
  background:rgba(255,46,99,.06);border:1px solid rgba(255,46,99,.3);
}
.grave h3{color:var(--neon3);font-size:15px;text-transform:uppercase;letter-spacing:1px}
.grave-item{display:flex;justify-content:space-between;font-size:14px;padding:6px 0;color:var(--muted);border-bottom:1px dashed rgba(255,46,99,.15)}
.grave-total{margin-top:10px;font-weight:800;color:var(--neon3)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.chip{
  padding:8px 14px;border-radius:20px;font-size:13px;cursor:pointer;
  background:#0d0d18;border:1px solid #2a2a44;color:var(--muted);transition:.2s;
}
.chip:hover{border-color:var(--neon1);color:var(--neon1)}
.sym-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.sym{
  padding:11px 12px;border-radius:12px;cursor:pointer;font-size:13.5px;
  background:#0d0d18;border:1px solid #2a2a44;color:var(--muted);transition:.2s;
}
.sym.on{border-color:var(--neon3);color:var(--neon3);background:rgba(255,46,99,.08)}
.dx-item{
  margin-top:14px;padding:16px;border-radius:14px;background:#0d0d18;border:1px solid #2a2a44;
  animation:cardIn .4s ease;
}
.dx-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px}
.dx-name{font-weight:800;font-size:16px}
.dx-price{color:var(--neon1);font-weight:700;white-space:nowrap}
.dx-diff{font-size:13px;color:var(--muted)}
.dx-joke{margin-top:8px;font-size:13.5px;color:#c9b8ff;font-style:italic}
.dx-steps{margin-top:10px;padding:12px;border-radius:10px;background:rgba(0,255,213,.05);font-size:13.5px;line-height:1.7}
.dx-steps b{color:var(--neon1)}
.warn{margin-top:14px;font-size:12.5px;color:var(--muted);text-align:center}
.danger-note{color:var(--neon3)}
.range-wrap{margin-top:6px}
input[type=range]{width:100%;accent-color:var(--neon1)}
.area-val{font-weight:800;color:var(--neon1);font-size:18px}
.estimate{
  text-align:center;font-size:clamp(30px,7vw,48px);font-weight:900;color:var(--neon1);
  text-shadow:0 0 30px rgba(0,255,213,.5);margin-top:8px;
}
.estimate.danger{color:var(--neon3);text-shadow:0 0 30px rgba(255,46,99,.5)}
.stage-row{margin:12px 0}
.stage-name{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;margin-bottom:5px}
.plan{margin-top:18px;padding:16px;border-radius:14px;background:rgba(0,255,213,.05);border:1px solid rgba(0,255,213,.2)}
.plan h3{color:var(--neon1);font-size:14px;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px}
